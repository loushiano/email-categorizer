<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Your HalalEat Receipt</title>
    <style>

        @media only screen and (max-width: 620px) {
		table {
		width:100% !important;
		margin:0px !important;}
        }
    </style>
  </head>
  <body
    style="
      width: 100% !important;
      height: 100%;
      margin: 0;
      line-height: 1.4;
      background-color: white;
      color: #C63131;
    "
  >
    <div style="width: 100%; margin: 0; padding: 0; background-color: white">
      <table
        style="
          width: 50%;
          margin-left: 25%;
          padding: 10px;
          border-top: 1px solid #C63131;
          border-bottom: 1px solid #C63131;
          background-color: white;
        "
      >
        <tr>
          <td
            style="
              padding-top: 3px;
              padding-bottom: 3px;
              border-bottom: 1px solid #C63131;
            "
          >
            <p style="color: #C63131; font-weight: bold; font-size: 20px">
              HALAL EAT
            </p>
            <p></p>
          </td>
        </tr>
        <tr>
          <td
            style="
              padding-top: 3px;
              padding-bottom: 3px;
              border-bottom: 1px solid #C63131;
            ">
            <p style="color: black; font-size: 18px; font-weight: bold">
              Thank you for ordering with HalalEat
            </p>
            <p style="color: black; font-size: 18px">
              Your order from @@from@@ has been delivered at @@time@@
            </p>
            <p style="color: black; font-size: 18px">
             Your total is: @@total@@
            </p>
          </td>
        </tr>
        <tr>
          <td>
            <p style="color: #475a67; font-size: 10px">
              Fozitto Inc
              <br />101 Queen Street
            </p>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
